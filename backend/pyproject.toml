[project]
name = "autolink-backend"
version = "1.0.0"
requires-python = ">=3.12"
# Versions below are the ones the test suite was run against.
dependencies = [
  "flask==3.1.3",
  "pyjwt==2.7.0",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["requests==2.34.2", "pytest>=8"]
production = ["gunicorn>=23", "boto3>=1.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
