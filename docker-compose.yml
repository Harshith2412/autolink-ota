# Local stack in containers. (unverified: Docker was not available in the build
# environment; the verified path is `make setup && make serve`, see README.)
services:
  backend:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - backend-data:/data
      - ./.dev/trust.json:/config/trust.json:ro
  ecu:
    build: { context: ., dockerfile: infrastructure/docker/ecu.Dockerfile }
    depends_on: [backend]
    profiles: ["vehicle"]
    environment:
      AUTOLINK_DEVICE_TOKEN: ${AUTOLINK_DEVICE_TOKEN:?register a vehicle first}
    command: ["--config", "/config/ecu.json"]
    volumes:
      - ./infrastructure/docker/ecu.compose.json:/config/ecu.json:ro
      - ./.dev/trust.json:/config/trust.json:ro
      - ecu-state:/state
volumes:
  backend-data:
  ecu-state:
